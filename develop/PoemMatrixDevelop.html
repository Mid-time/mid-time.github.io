<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>诗阵</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: #2b2b2b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .game-container {
            max-width: 700px;
            width: 100%;
            background: #3a3a3a;
            border-radius: 32px;
            padding: 24px;
            box-shadow: 0 20px 30px rgba(0,0,0,0.5);
            border: 1px solid #5a5a5a;
            position: relative;
        }

        .history-panel {
            background: #4f4f4f;
            border-radius: 24px;
            padding: 18px 20px;
            display: flex;
            justify-content: space-around;
            margin-bottom: 28px;
            border: 1px solid #6e6e6e;
            box-shadow: inset 0 2px 5px #2e2e2e;
        }

        .record-item {
            text-align: center;
            color: #d6d6d6;
        }

        .record-label {
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #a5a5a5;
            margin-bottom: 6px;
        }

        .record-value {
            font-size: 1.8rem;
            font-weight: 600;
            color: #f0f0f0;
            text-shadow: 0 2px 3px #1f1f1f;
        }

        .view {
            transition: opacity 0.2s ease;
        }

        .hidden-view {
            display: none !important;
        }

        .welcome-area {
            text-align: center;
        }

        .big-btn {
            background: #5e5e5e;
            border: none;
            color: #eaeaea;
            font-size: 2rem;
            font-weight: 500;
            padding: 20px 30px;
            border-radius: 60px;
            width: 100%;
            margin: 20px 0 16px;
            box-shadow: 0 8px 0 #2d2d2d, 0 10px 15px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: all 0.08s linear;
            letter-spacing: 2px;
        }

        .big-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #2d2d2d, 0 8px 12px rgba(0,0,0,0.3);
        }

        .rule-box {
            background: #4b4b4b;
            padding: 18px;
            border-radius: 28px;
            color: #c0c0c0;
            text-align: left;
            border: 1px solid #6a6a6a;
            margin-bottom: 25px;
        }

        .rule-box p {
            margin: 8px 0;
            font-size: 1rem;
        }

        .rule-box .title {
            font-weight: 600;
            color: #dbdbdb;
            border-bottom: 1px dashed #777;
            padding-bottom: 6px;
            margin-bottom: 12px;
        }

        .mode-selector {
            display: flex;
            gap: 16px;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .mode-btn {
            flex: 1;
            background: #606060;
            border: none;
            color: #ececec;
            font-size: 1.3rem;
            padding: 16px 0;
            border-radius: 40px;
            font-weight: 600;
            box-shadow: 0 5px 0 #353535;
            cursor: pointer;
            transition: 0.05s linear;
        }

        .mode-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #353535;
        }

        .game-play-area {
            text-align: center;
            position: relative;
        }

        .stats-bar {
            background: #4a4a4a;
            padding: 14px 20px;
            border-radius: 40px;
            margin-bottom: 10px;
            font-size: 1.8rem;
            font-weight: 600;
            color: #e2e2e2;
            border: 1px solid #717171;
            box-shadow: inset 0 2px 5px #2f2f2f;
        }

        .debug-panel {
            background: #3d3d3d;
            border: 2px solid #7a7a7a;
            border-radius: 24px;
            padding: 12px 15px;
            margin-bottom: 15px;
            color: #d0d0d0;
            font-size: 0.9rem;
            text-align: left;
            max-height: 200px;
            overflow-y: auto;
        }

        .debug-panel h4 {
            color: #b0b0b0;
            margin-bottom: 8px;
            border-bottom: 1px dashed #777;
            padding-bottom: 4px;
        }

        .debug-panel ul {
            list-style: none;
            padding-left: 5px;
        }

        .debug-panel li {
            margin: 4px 0;
            font-family: monospace;
        }

        .debug-panel .std-ans {
            color: #a5d6a5;
            font-weight: bold;
        }

        .debug-panel .conf-item {
            color: #f0b3b3;
        }

        .grid-7x7 {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            background: #505050;
            padding: 18px;
            border-radius: 36px;
            border: 2px solid #6b6b6b;
            margin-bottom: 20px;
        }

        .cell {
            aspect-ratio: 1 / 1;
            background: #616161;
            border-radius: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            font-weight: 600;
            color: #eaeaea;
            box-shadow: 0 4px 0 #383838;
            cursor: pointer;
            transition: all 0.07s;
            user-select: none;
        }

        .cell.selected {
            background: #9e9e9e;
            box-shadow: 0 0 0 3px #c5c5c5, 0 4px 0 #5a5a5a;
            color: #1f1f1f;
            font-weight: 700;
            transform: scale(1.02);
        }

        .cell.disabled {
            opacity: 0.3;
            pointer-events: none;
            box-shadow: 0 2px 0 #3a3a3a;
        }

        .cell.highlight-green {
            background: #2e7d32 !important;
            opacity: 1 !important;
            color: #ffffff !important;
            box-shadow: 0 0 0 3px #a5d6a5, 0 4px 0 #1b5e20 !important;
            font-weight: 700;
        }

        .submit-btn {
            background: #6b6b6b;
            border: none;
            color: #dcdcdc;
            font-size: 1.8rem;
            padding: 16px 30px;
            border-radius: 50px;
            font-weight: 600;
            width: 100%;
            box-shadow: 0 6px 0 #3b3b3b;
            cursor: pointer;
            transition: 0.05s linear;
            margin: 16px 0 12px;
        }

        .submit-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #3b3b3b;
        }

        .submit-btn.disabled-btn {
            opacity: 0.4;
            pointer-events: none;
            box-shadow: 0 4px 0 #3b3b3b;
        }

        .toast-container {
            position: relative;
            width: 100%;
            height: 0;
            display: flex;
            justify-content: center;
            pointer-events: none;
            z-index: 100;
        }

        .toast-message {
            position: absolute;
            top: 0;
            width: 90%;
            max-width: 500px;
            background: #4e4e4e;
            border-radius: 40px;
            padding: 18px 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            text-align: center;
            font-size: 1.6rem;
            font-weight: 600;
            color: white;
            border-left: 8px solid transparent;
            transform: translateX(100%);
            opacity: 0;
            animation: slideInOut 2.2s ease-in-out forwards;
            pointer-events: none;
        }

        .toast-message.correct {
            border-left-color: #6ab04c;
            background: #3e6b3e;
        }

        .toast-message.wrong {
            border-left-color: #eb4d4b;
            background: #6b3f3f;
        }

        .toast-sub {
            font-size: 1.2rem;
            font-weight: 300;
            color: #dddddd;
            margin-top: 6px;
            letter-spacing: 1px;
        }

        @keyframes slideInOut {
            0% { transform: translateX(100%); opacity: 0; }
            15% { transform: translateX(0); opacity: 1; }
            85% { transform: translateX(0); opacity: 1; }
            100% { transform: translateX(-100%); opacity: 0; }
        }

        .contact-area {
            margin-top: 25px;
            text-align: center;
            color: #8f8f8f;
            font-size: 1rem;
            position: relative;
        }

        .contact-trigger {
            text-decoration: underline dotted;
            cursor: pointer;
            color: #b3b3b3;
            margin-right: 15px;
        }

        .debug-trigger {
            text-decoration: underline dotted;
            cursor: pointer;
            color: #b3b3b3;
            margin-left: 15px;
        }

        .email-show, .debug-status {
            background: #404040;
            padding: 8px 18px;
            border-radius: 30px;
            display: inline-block;
            margin-top: 8px;
            color: #cfcfcf;
            border: 1px solid #6f6f6f;
        }

        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(20,20,20,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .result-card {
            background: #4e4e4e;
            max-width: 380px;
            width: 90%;
            padding: 30px 20px;
            border-radius: 48px;
            border: 3px solid #8a8a8a;
            text-align: center;
            color: #efefef;
        }

        .result-card h2 {
            font-size: 2rem;
            margin-bottom: 16px;
            font-weight: 400;
        }

        .result-stat {
            font-size: 1.4rem;
            background: #3f3f3f;
            margin: 16px 0;
            padding: 12px;
            border-radius: 40px;
        }

        .confirm-btn {
            background: #707070;
            border: none;
            color: white;
            font-size: 1.7rem;
            padding: 12px 30px;
            border-radius: 50px;
            margin-top: 20px;
            box-shadow: 0 5px 0 #3a3a3a;
            cursor: pointer;
            width: 100%;
        }

        .debug-note {
            font-size: 0.9rem;
            color: #ffb86c;
            margin-top: 5px;
        }
    </style>
</head>
<body>
<div class="game-container" id="gameContainer">
    <!-- 欢迎视图 (包含历史记录) -->
    <div id="welcomeView" class="welcome-area view">
        <div class="history-panel">
            <div class="record-item">
                <div class="record-label">⏱️ 计时最高得分</div>
                <div class="record-value" id="highScoreDisplay">0</div>
            </div>
            <div class="record-item">
                <div class="record-label">⚡ 计数最快时间</div>
                <div class="record-value" id="bestTimeDisplay">--</div>
            </div>
        </div>
        <button class="big-btn" id="startBtn">▶ 开始游戏</button>
        <div class="rule-box" id="ruleBox">
            <div class="title">📜 规则说明</div>
            <p>✦ 点击格子选中汉字，每次最多选7个，凑成一句七言诗。</p>
            <p>✦ 选满7字后提交，正确得分，错误显示正确答案。</p>
            <p>✦ 计时模式：10分钟内答尽可能多；计数模式：最快完成20题。</p>
            <p>✦ 只有答对才会减少剩余题数（计数模式）。</p>
        </div>
        <!-- 模式选择区 (开始后替换规则) -->
        <div id="modeSelector" class="mode-selector hidden-view">
            <button class="mode-btn" id="modeTime">⏳ 计时 (10分钟)</button>
            <button class="mode-btn" id="modeCount">🔢 计数 (20题)</button>
        </div>
    </div>

    <!-- 游戏视图 -->
    <div id="gameView" class="game-play-area view hidden-view">
        <div class="stats-bar" id="gameStatDisplay">剩余 10:00 · 得分 0</div>
        <!-- Debug 信息面板 (初始隐藏) -->
        <div id="debugPanel" class="debug-panel hidden-view"></div>
        <div class="grid-7x7" id="gridContainer"></div>
        <button class="submit-btn disabled-btn" id="submitGameBtn">提交答案</button>
        <div class="toast-container" id="toastContainer"></div>
    </div>

    <!-- 底部联系 + Debug 入口 -->
    <div class="contact-area">
        <span class="contact-trigger" id="contactLink">📧 联系我</span>
        <span class="debug-trigger" id="debugLink">⚙️ Debug</span>
        <div id="emailDisplay" class="email-show" style="display: none;">3310764938@qq.com</div>
        <div id="debugStatus" class="debug-status" style="display: none;">🔧 Debug模式开启</div>
    </div>
</div>

<!-- 成绩弹窗 -->
<div id="resultOverlay" class="overlay" style="display: none;">
    <div class="result-card">
        <h2 id="resultTitle">⏰ 时间到</h2>
        <div class="result-stat" id="resultDetail">完成 0 题 · 正确率 0%</div>
        <div id="debugResultNote" class="debug-note" style="display: none;">(Debug模式 · 不计入记录)</div>
        <button class="confirm-btn" id="confirmResult">确 认</button>
    </div>
</div>

<script>
    (function() {
        // ---------- 全局变量 ----------
        let allAnswers = [];
        // 后备诗库
        const demoPoems = [
            "两个黄鹂鸣翠柳", "一行白鹭上青天", "窗含西岭千秋雪", "门泊东吴万里船",
            "春眠不觉晓处处", "处处闻啼鸟夜来", "夜来风雨声花落", "白日依山尽黄河",
            "黄河入海流欲穷", "欲穷千里目更上", "更上一层楼清明", "清明时节雨纷纷",
            "路上行人欲断魂", "借问酒家何处有", "牧童遥指杏花村", "独在异乡为异客",
            "每逢佳节倍思亲", "遥知兄弟登高处", "遍插茱萸少一人", "故人西辞黄鹤楼"
        ];

        let currentMode = null;
        let timerInterval = null;
        let gameActive = false;
        let timeLeft = 600;
        let countLeft = 20;
        let startTimestamp = null;
        let correctCount = 0;
        let totalAttempts = 0;
        let currentStdAnswer = '';
        let currentConfusions = [];
        let currentMissingChars = [];
        let currentMatrix = [];
        let selectedIndices = [];
        let gridCells = [];
        let canInteract = true;

        // Debug 模式标志
        let debugMode = false;

        // 历史记录 (localStorage)
        let highScoreTime = parseInt(localStorage.getItem('poem_highScore_time')) || 0;
        let bestTimeCount = parseFloat(localStorage.getItem('poem_bestTime_count')) || Infinity;

        // DOM 元素
        const welcomeView = document.getElementById('welcomeView');
        const gameView = document.getElementById('gameView');
        const startBtn = document.getElementById('startBtn');
        const ruleBox = document.getElementById('ruleBox');
        const modeSelector = document.getElementById('modeSelector');
        const modeTimeBtn = document.getElementById('modeTime');
        const modeCountBtn = document.getElementById('modeCount');
        const gameStatDisplay = document.getElementById('gameStatDisplay');
        const gridContainer = document.getElementById('gridContainer');
        const submitBtn = document.getElementById('submitGameBtn');
        const toastContainer = document.getElementById('toastContainer');
        const highScoreDisplay = document.getElementById('highScoreDisplay');
        const bestTimeDisplay = document.getElementById('bestTimeDisplay');
        const contactLink = document.getElementById('contactLink');
        const debugLink = document.getElementById('debugLink');
        const emailDisplay = document.getElementById('emailDisplay');
        const debugStatus = document.getElementById('debugStatus');
        const resultOverlay = document.getElementById('resultOverlay');
        const resultTitle = document.getElementById('resultTitle');
        const resultDetail = document.getElementById('resultDetail');
        const debugResultNote = document.getElementById('debugResultNote');
        const confirmResult = document.getElementById('confirmResult');
        const debugPanel = document.getElementById('debugPanel');

        function updateHistoryUI() {
            highScoreDisplay.textContent = highScoreTime;
            if (bestTimeCount === Infinity) {
                bestTimeDisplay.textContent = '--';
            } else {
                const mins = Math.floor(bestTimeCount / 60);
                const secs = Math.floor(bestTimeCount % 60);
                bestTimeDisplay.textContent = `${mins}:${secs.toString().padStart(2,'0')}`;
            }
        }
        updateHistoryUI();

        async function loadAnswers() {
            try {
                const response = await fetch('answer.txt');
                if (!response.ok) throw new Error('网络问题');
                const text = await response.text();
                const lines = text.split(/\r?\n/).map(line => line.trim()).filter(line => line.length === 7);
                allAnswers = lines.length ? lines : [...demoPoems];
            } catch (e) {
                allAnswers = [...demoPoems];
            }
        }

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function selectStdAndConfusions() {
            const shuffled = shuffleArray([...allAnswers]);
            for (let attempt = 0; attempt < 50; attempt++) {
                const std = shuffled[Math.floor(Math.random() * shuffled.length)];
                const stdCharsSet = new Set(std);
                const others = shuffled.filter(a => a !== std);
                if (others.length < 8) continue;
                const confusions = [];
                const shuffledOthers = shuffleArray([...others]);
                for (let cand of shuffledOthers) {
                    if (confusions.length >= 8) break;
                    const candSet = new Set(cand);
                    const missing = [...stdCharsSet].some(ch => !candSet.has(ch));
                    if (missing) confusions.push(cand);
                }
                if (confusions.length === 8) return { std, confusions };
            }
            return { std: allAnswers[0], confusions: allAnswers.slice(1,9) };
        }

        function generateMatrixWithConstraints(std, confusions, maxAttempts = 30) {
            const stdChars = std.split('');
            const allChars = [std, ...confusions].reduce((acc, ans) => acc.concat(ans.split('')), []);
            let bestMatrix = null;
            let bestMissing = [];

            for (let attempt = 0; attempt < maxAttempts; attempt++) {
                const missingChars = [];
                for (let conf of confusions) {
                    const confChars = conf.split('');
                    const diff = confChars.filter(ch => !stdChars.includes(ch));
                    let miss;
                    if (diff.length > 0) {
                        miss = diff[Math.floor(Math.random() * diff.length)];
                    } else {
                        miss = confChars[0];
                    }
                    missingChars.push(miss);
                }

                let available = [...allChars];
                for (let ch of stdChars) {
                    const idx = available.indexOf(ch);
                    if (idx !== -1) available.splice(idx, 1);
                }
                for (let ch of missingChars) {
                    const idx = available.indexOf(ch);
                    if (idx !== -1) available.splice(idx, 1);
                }

                if (available.length < 42) continue;

                shuffleArray(available);
                const extra = available.slice(0, 42);
                let matrix = stdChars.concat(extra);
                matrix = shuffleArray(matrix);

                let ok = true;
                for (let i = 0; i < confusions.length; i++) {
                    const conf = confusions[i];
                    const need = conf.split('');
                    const countMap = {};
                    for (let ch of matrix) countMap[ch] = (countMap[ch] || 0) + 1;
                    let complete = true;
                    for (let ch of need) {
                        if ((countMap[ch] || 0) <= 0) {
                            complete = false;
                            break;
                        }
                        countMap[ch]--;
                    }
                    if (complete) {
                        ok = false;
                        break;
                    }
                }
                if (ok) {
                    bestMatrix = matrix;
                    bestMissing = missingChars;
                    break;
                }
            }
            if (!bestMatrix) {
                bestMatrix = generateMatrixFallback(std, confusions);
                bestMissing = confusions.map(() => '?');
            }
            return { matrix: bestMatrix, missing: bestMissing };
        }

        function generateMatrixFallback(std, confusions) {
            const allChars = [std, ...confusions].reduce((acc, ans) => acc.concat(ans.split('')), []);
            shuffleArray(allChars);
            const stdChars = std.split('');
            const matrix = [...stdChars];
            let remaining = [...allChars];
            for (let ch of stdChars) {
                const idx = remaining.indexOf(ch);
                if (idx !== -1) remaining.splice(idx, 1);
            }
            shuffleArray(remaining);
            matrix.push(...remaining.slice(0, 42));
            return shuffleArray(matrix);
        }

        function updateDebugPanel() {
            if (!debugMode || !gameActive || !currentConfusions) {
                debugPanel.classList.add('hidden-view');
                return;
            }
            debugPanel.classList.remove('hidden-view');
            let html = '<h4>🔍 Debug 信息</h4>';
            html += `<p><span class="std-ans">✅ 标准答案：</span> ${currentStdAnswer}</p>`;
            html += '<ul>';
            for (let i = 0; i < currentConfusions.length; i++) {
                const conf = currentConfusions[i];
                const miss = currentMissingChars[i] || '?';
                html += `<li class="conf-item">❌ 混淆 ${i+1}: ${conf}  (缺失: <strong>${miss}</strong>)</li>`;
            }
            html += '</ul>';
            debugPanel.innerHTML = html;
        }

        function renderGrid(matrixChars) {
            gridContainer.innerHTML = '';
            for (let i = 0; i < 49; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.index = i;
                cell.textContent = matrixChars[i];
                gridContainer.appendChild(cell);
            }
            gridCells = document.querySelectorAll('.cell');
            attachCellListeners();
        }

        function attachCellListeners() {
            gridCells.forEach(cell => {
                cell.removeEventListener('click', cellClickHandler);
                cell.addEventListener('click', cellClickHandler);
            });
        }

        function cellClickHandler(e) {
            if (!gameActive || !canInteract) return;
            const index = parseInt(e.currentTarget.dataset.index);
            if (selectedIndices.includes(index)) {
                selectedIndices = selectedIndices.filter(i => i !== index);
                e.currentTarget.classList.remove('selected');
            } else {
                if (selectedIndices.length >= 7) return;
                selectedIndices.push(index);
                e.currentTarget.classList.add('selected');
            }
            updateCellsDisabledState();
        }

        function updateCellsDisabledState() {
            const exactlySeven = selectedIndices.length === 7;
            gridCells.forEach(cell => {
                const idx = parseInt(cell.dataset.index);
                if (!selectedIndices.includes(idx)) {
                    cell.classList.toggle('disabled', exactlySeven);
                } else {
                    cell.classList.remove('disabled');
                }
            });
            submitBtn.classList.toggle('disabled-btn', !exactlySeven);
        }

        function clearSelectedAndEnable() {
            selectedIndices = [];
            gridCells.forEach(cell => cell.classList.remove('selected', 'disabled', 'highlight-green'));
            submitBtn.classList.add('disabled-btn');
        }

        function highlightCorrectAnswer() {
            const answerChars = currentStdAnswer.split('');
            const matrix = currentMatrix;
            const usedIndices = new Set();
            const highlightIndices = [];

            for (let ch of answerChars) {
                for (let i = 0; i < matrix.length; i++) {
                    if (matrix[i] === ch && !usedIndices.has(i)) {
                        usedIndices.add(i);
                        highlightIndices.push(i);
                        break;
                    }
                }
            }

            gridCells.forEach(cell => {
                cell.classList.remove('selected');
                cell.classList.add('disabled');
            });

            highlightIndices.forEach(idx => {
                if (gridCells[idx]) {
