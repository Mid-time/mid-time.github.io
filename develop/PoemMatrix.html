<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>网站维护中 · 灰度提示</title>
  <!-- Font Awesome 5 (免费版) 用于显示抱歉图标 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <style>
    /* 极简重置 + 灰色调氛围 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e9ecef;  /* 柔和的中性暖灰基底 */
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', 'Noto Sans', sans-serif;
      padding: 1.5rem;
      line-height: 1.5;
    }

    /* 浅灰色卡片 —— 层次微妙，保持整体灰色调 */
    .maintenance-card {
      max-width: 32rem;
      width: 100%;
      background: #f5f7fa;   /* 比背景稍微亮一点点的灰白 */
      border-radius: 2.5rem;
      padding: 3rem 2rem;
      box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.05),
                  0 8px 15px -6px rgba(0, 0, 0, 0.02),
                  inset 0 1px 0 rgba(255, 255, 255, 0.6); /* 极淡内发光增加质感 */
      text-align: center;
      border: 1px solid rgba(115, 115, 125, 0.08);
      transition: all 0.2s ease;
    }

    /* 抱歉图标区域：所有灰度层次 */
    .icon-wrapper {
      font-size: 6rem;
      line-height: 1;
      color: #6b7280;        /* 中灰色，温和不刺眼 */
      margin-bottom: 1.75rem;
      text-shadow: 0 2px 5px rgba(95, 95, 105, 0.1);
      display: flex;
      justify-content: center;
    }

    /* 图标本身无须额外修饰，利用父级色彩 */
    .icon-wrapper i {
      display: inline-block;
      transform: scale(1);
      transition: transform 0.2s cubic-bezier(0.2, 0.9, 0.3, 1.1);
    }

    /* 非常微妙的悬停动效（非必须，但增加一点细节），不影响灰度本质 */
    .icon-wrapper i:hover {
      transform: scale(1.02);
      color: #5f6a7a;
    }

    /* 主信息文字：温和深灰，清晰易读 */
    .message {
      font-size: clamp(1.8rem, 5vw, 2.4rem);
      font-weight: 340;
      letter-spacing: 0.01em;
      color: #3d434b;        /* 深灰，保留柔和对比 */
      line-height: 1.4;
      max-width: 90%;
      margin-left: auto;
      margin-right: auto;
      word-break: break-word;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.7);
    }

    /* 可选微细分割线 —— 非常低调，增加层次但不抢眼 */
    .card-footer {
      margin-top: 2rem;
      border-top: 1px solid rgba(125, 130, 140, 0.12);
      padding-top: 1.2rem;
      font-size: 0.85rem;
      color: #8e96a3;
      letter-spacing: 0.5px;
      font-weight: 350;
    }

    /* 让 footer 里的文字更含蓄 */
    .card-footer span {
      opacity: 0.7;
    }

    /* 移动端细微调整 */
    @media (max-width: 480px) {
      .maintenance-card {
        padding: 2.2rem 1.2rem;
        border-radius: 2rem;
      }
      .icon-wrapper {
        font-size: 5rem;
        margin-bottom: 1.25rem;
      }
      .message {
        font-size: 1.8rem;
      }
    }

    /* 对于更小屏幕防止文字溢出 */
    @media (max-width: 360px) {
      .message {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>
  <div class="maintenance-card">
    <!-- 抱歉图标：frown (皱眉) 表达歉意，灰色调完全融合 -->
    <div class="icon-wrapper">
      <i class="far fa-frown" aria-hidden="true"></i>
    </div>

    <!-- 核心提示文字：完全符合题目要求 -->
    <div class="message">
      因为维护原因，暂时无法访问
    </div>

    <!-- 极低调的脚注 —— 仅用于丰富层次，不干扰主要信息；完全灰色系，无额外文字 -->
    <div class="card-footer">
      <span>⸻</span>
    </div>
  </div>
</body>
</html>
