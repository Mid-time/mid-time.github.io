<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>诗阵</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: #2b2b2b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .game-container {
            max-width: 700px;
            width: 100%;
            background: #3a3a3a;
            border-radius: 32px;
            padding: 24px;
            box-shadow: 0 20px 30px rgba(0,0,0,0.5);
            border: 1px solid #5a5a5a;
            position: relative;
        }

        /* 历史记录面板 (仅欢迎视图可见) */
        .history-panel {
            background: #4f4f4f;
            border-radius: 24px;
            padding: 18px 20px;
            display: flex;
            justify-content: space-around;
            margin-bottom: 28px;
            border: 1px solid #6e6e6e;
            box-shadow: inset 0 2px 5px #2e2e2e;
        }

        .record-item {
            text-align: center;
            color: #d6d6d6;
        }

        .record-label {
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #a5a5a5;
            margin-bottom: 6px;
        }

        .record-value {
            font-size: 1.8rem;
            font-weight: 600;
            color: #f0f0f0;
            text-shadow: 0 2px 3px #1f1f1f;
        }

        /* 主视图切换 */
        .view {
            transition: opacity 0.2s ease;
        }

        .hidden-view {
            display: none !important;
        }

        /* 初始界面 */
        .welcome-area {
            text-align: center;
        }

        .big-btn {
            background: #5e5e5e;
            border: none;
            color: #eaeaea;
            font-size: 2rem;
            font-weight: 500;
            padding: 20px 30px;
            border-radius: 60px;
            width: 100%;
            margin: 20px 0 16px;
            box-shadow: 0 8px 0 #2d2d2d, 0 10px 15px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: all 0.08s linear;
            letter-spacing: 2px;
        }

        .big-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #2d2d2d, 0 8px 12px rgba(0,0,0,0.3);
        }

        .rule-box {
            background: #4b4b4b;
            padding: 18px;
            border-radius: 28px;
            color: #c0c0c0;
            text-align: left;
            border: 1px solid #6a6a6a;
            margin-bottom: 25px;
        }

        .rule-box p {
            margin: 8px 0;
            font-size: 1rem;
        }

        .rule-box .title {
            font-weight: 600;
            color: #dbdbdb;
            border-bottom: 1px dashed #777;
            padding-bottom: 6px;
            margin-bottom: 12px;
        }

        /* 模式选择按钮组 */
        .mode-selector {
            display: flex;
            gap: 16px;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .mode-btn {
            flex: 1;
            background: #606060;
            border: none;
            color: #ececec;
            font-size: 1.3rem;
            padding: 16px 0;
            border-radius: 40px;
            font-weight: 600;
            box-shadow: 0 5px 0 #353535;
            cursor: pointer;
            transition: 0.05s linear;
        }

        .mode-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #353535;
        }

        /* 游戏界面 */
        .game-play-area {
            text-align: center;
            position: relative;
        }

        .stats-bar {
            background: #4a4a4a;
            padding: 14px 20px;
            border-radius: 40px;
            margin-bottom: 25px;
            font-size: 1.8rem;
            font-weight: 600;
            color: #e2e2e2;
            border: 1px solid #717171;
            box-shadow: inset 0 2px 5px #2f2f2f;
        }

        .grid-7x7 {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            background: #505050;
            padding: 18px;
            border-radius: 36px;
            border: 2px solid #6b6b6b;
            margin-bottom: 20px;
        }

        .cell {
            aspect-ratio: 1 / 1;
            background: #616161;
            border-radius: 0; /* 方形按钮 */
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            font-weight: 600;
            color: #eaeaea;
            box-shadow: 0 4px 0 #383838;
            cursor: pointer;
            transition: all 0.07s;
            user-select: none;
        }

        .cell.selected {
            background: #9e9e9e;
            box-shadow: 0 0 0 3px #c5c5c5, 0 4px 0 #5a5a5a;
            color: #1f1f1f;
            font-weight: 700;
            transform: scale(1.02);
        }

        .cell.disabled {
            opacity: 0.3;
            pointer-events: none;
            box-shadow: 0 2px 0 #3a3a3a;
        }

        .submit-btn {
            background: #6b6b6b;
            border: none;
            color: #dcdcdc;
            font-size: 1.8rem;
            padding: 16px 30px;
            border-radius: 50px;
            font-weight: 600;
            width: 100%;
            box-shadow: 0 6px 0 #3b3b3b;
            cursor: pointer;
            transition: 0.05s linear;
            margin: 16px 0 12px;
        }

        .submit-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #3b3b3b;
        }

        .submit-btn.disabled-btn {
            opacity: 0.4;
            pointer-events: none;
            box-shadow: 0 4px 0 #3b3b3b;
        }

        /* 右侧滑入横幅容器 */
        .toast-container {
            position: relative;
            width: 100%;
            height: 0;
            display: flex;
            justify-content: center;
            pointer-events: none;
            z-index: 100;
        }

        .toast-message {
            position: absolute;
            top: 0;
            width: 90%;
            max-width: 500px;
            background: #4e4e4e;
            border-radius: 40px;
            padding: 18px 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            text-align: center;
            font-size: 1.6rem;
            font-weight: 600;
            color: white;
            border-left: 8px solid transparent;
            transform: translateX(100%);
            opacity: 0;
            animation: slideInOut 2.2s ease-in-out forwards;
            pointer-events: none;
        }

        .toast-message.correct {
            border-left-color: #6ab04c;
            background: #3e6b3e;
        }

        .toast-message.wrong {
            border-left-color: #eb4d4b;
            background: #6b3f3f;
        }

        .toast-sub {
            font-size: 1.2rem;
            font-weight: 300;
            color: #dddddd;
            margin-top: 6px;
            letter-spacing: 1px;
        }

        @keyframes slideInOut {
            0% { transform: translateX(100%); opacity: 0; }
            15% { transform: translateX(0); opacity: 1; }
            85% { transform: translateX(0); opacity: 1; }
            100% { transform: translateX(-100%); opacity: 0; }
        }

        /* 底部联系 */
        .contact-area {
            margin-top: 25px;
            text-align: center;
            color: #8f8f8f;
            font-size: 1rem;
        }

        .contact-trigger {
            text-decoration: underline dotted;
            cursor: pointer;
            color: #b3b3b3;
        }

        .email-show {
            background: #404040;
            padding: 8px 18px;
            border-radius: 30px;
            display: inline-block;
            margin-top: 8px;
            color: #cfcfcf;
            border: 1px solid #6f6f6f;
        }

        /* 成绩弹窗 */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(20,20,20,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .result-card {
            background: #4e4e4e;
            max-width: 380px;
            width: 90%;
            padding: 30px 20px;
            border-radius: 48px;
            border: 3px solid #8a8a8a;
            text-align: center;
            color: #efefef;
        }

        .result-card h2 {
            font-size: 2rem;
            margin-bottom: 16px;
            font-weight: 400;
        }

        .result-stat {
            font-size: 1.4rem;
            background: #3f3f3f;
            margin: 16px 0;
            padding: 12px;
            border-radius: 40px;
        }

        .confirm-btn {
            background: #707070;
            border: none;
            color: white;
            font-size: 1.7rem;
            padding: 12px 30px;
            border-radius: 50px;
            margin-top: 20px;
            box-shadow: 0 5px 0 #3a3a3a;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>
<div class="game-container" id="gameContainer">
    <!-- 欢迎视图 (包含历史记录) -->
    <div id="welcomeView" class="welcome-area view">
        <div class="history-panel">
            <div class="record-item">
                <div class="record-label">⏱️ 计时最高得分</div>
                <div class="record-value" id="highScoreDisplay">0</div>
            </div>
            <div class="record-item">
                <div class="record-label">⚡ 计数最快时间</div>
                <div class="record-value" id="bestTimeDisplay">--</div>
            </div>
        </div>
        <button class="big-btn" id="startBtn">▶ 开始游戏</button>
        <div class="rule-box" id="ruleBox">
            <div class="title">📜 规则说明</div>
            <p>✦ 点击格子选中汉字，每次最多选7个，凑成一句七言诗。</p>
            <p>✦ 选满7字后提交，正确得分，错误显示正确答案。</p>
            <p>✦ 计时模式：10分钟内答尽可能多；计数模式：最快完成20题。</p>
            <p>✦ 只有答对才会减少剩余题数（计数模式）。</p>
        </div>
        <!-- 模式选择区 (开始后替换规则) -->
        <div id="modeSelector" class="mode-selector hidden-view">
            <button class="mode-btn" id="modeTime">⏳ 计时 (10分钟)</button>
            <button class="mode-btn" id="modeCount">🔢 计数 (20题)</button>
        </div>
    </div>

    <!-- 游戏视图 (无历史记录，无联系显示，只有统计和网格) -->
    <div id="gameView" class="game-play-area view hidden-view">
        <div class="stats-bar" id="gameStatDisplay">剩余 10:00 · 得分 0</div>

        <!-- 7x7 网格 -->
        <div class="grid-7x7" id="gridContainer"></div>

        <!-- 提交按钮 -->
        <button class="submit-btn disabled-btn" id="submitGameBtn">提交答案</button>

        <!-- 用于承载右侧滑入横幅的容器（绝对定位相对游戏区域） -->
        <div class="toast-container" id="toastContainer"></div>
    </div>

    <!-- 底部联系 (全局可见) -->
    <div class="contact-area">
        <span class="contact-trigger" id="contactLink">📧 联系我</span>
        <div id="emailDisplay" class="email-show" style="display: none;">3310764938@qq.com</div>
    </div>
</div>

<!-- 成绩弹窗 -->
<div id="resultOverlay" class="overlay" style="display: none;">
    <div class="result-card">
        <h2 id="resultTitle">⏰ 时间到</h2>
        <div class="result-stat" id="resultDetail">完成 0 题 · 正确率 0%</div>
        <button class="confirm-btn" id="confirmResult">确 认</button>
    </div>
</div>

<script>
    (function() {
        // ---------- 全局变量 ----------
        let allAnswers = [];                // 从answer.txt加载的所有诗句
        // 后备诗库 (确保都是7字)
        const demoPoems = [
            "两个黄鹂鸣翠柳", "一行白鹭上青天", "窗含西岭千秋雪", "门泊东吴万里船",
            "春眠不觉晓处处", "处处闻啼鸟夜来", "夜来风雨声花落", "白日依山尽黄河",
            "黄河入海流欲穷", "欲穷千里目更上", "更上一层楼清明", "清明时节雨纷纷",
            "路上行人欲断魂", "借问酒家何处有", "牧童遥指杏花村", "独在异乡为异客",
            "每逢佳节倍思亲", "遥知兄弟登高处", "遍插茱萸少一人", "故人西辞黄鹤楼"
        ];

        // 游戏状态
        let currentMode = null;              // 'time' 或 'count'
        let timerInterval = null;
        let gameActive = false;
        let timeLeft = 600;                  // 计时模式剩余秒数
        let countLeft = 20;                   // 计数模式剩余题数
        let startTimestamp = null;            // 模式开始时间戳(毫秒)
        let correctCount = 0;                 // 本次答对题数
        let totalAttempts = 0;                 // 本次总提交次数(用于正确率)
        let currentStdAnswer = '';            // 当前正确答案
        let currentMatrix = [];                // 49个汉字一维数组
        let selectedIndices = [];              // 按点击顺序记录选中的索引 (最多7)
        let gridCells = [];                    
        let canInteract = true;                 // 防止提交后连点

        // 历史记录 (localStorage)
        let highScoreTime = parseInt(localStorage.getItem('poem_highScore_time')) || 0;   
        let bestTimeCount = parseFloat(localStorage.getItem('poem_bestTime_count')) || Infinity; 

        // DOM 元素
        const welcomeView = document.getElementById('welcomeView');
        const gameView = document.getElementById('gameView');
        const startBtn = document.getElementById('startBtn');
        const ruleBox = document.getElementById('ruleBox');
        const modeSelector = document.getElementById('modeSelector');
        const modeTimeBtn = document.getElementById('modeTime');
        const modeCountBtn = document.getElementById('modeCount');
        const gameStatDisplay = document.getElementById('gameStatDisplay');
        const gridContainer = document.getElementById('gridContainer');
        const submitBtn = document.getElementById('submitGameBtn');
        const toastContainer = document.getElementById('toastContainer');
        const highScoreDisplay = document.getElementById('highScoreDisplay');
        const bestTimeDisplay = document.getElementById('bestTimeDisplay');
        const contactLink = document.getElementById('contactLink');
        const emailDisplay = document.getElementById('emailDisplay');
        const resultOverlay = document.getElementById('resultOverlay');
        const resultTitle = document.getElementById('resultTitle');
        const resultDetail = document.getElementById('resultDetail');
        const confirmResult = document.getElementById('confirmResult');

        // 初始化更新历史显示
        function updateHistoryUI() {
            highScoreDisplay.textContent = highScoreTime;
            if (bestTimeCount === Infinity) {
                bestTimeDisplay.textContent = '--';
            } else {
                const mins = Math.floor(bestTimeCount / 60);
                const secs = Math.floor(bestTimeCount % 60);
                bestTimeDisplay.textContent = `${mins}:${secs.toString().padStart(2,'0')}`;
            }
        }
        updateHistoryUI();

        // ---------- 加载诗句库 ----------
        async function loadAnswers() {
            try {
                const response = await fetch('answer.txt');
                if (!response.ok) throw new Error('网络问题');
                const text = await response.text();
                const lines = text.split(/\r?\n/).map(line => line.trim()).filter(line => line.length === 7);
                if (lines.length > 0) {
                    allAnswers = lines;
                } else {
                    allAnswers = [...demoPoems];
                }
            } catch (e) {
                console.warn('加载answer.txt失败，使用默认诗库', e);
                allAnswers = [...demoPoems];
            }
        }

        // 洗牌
        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // 选择标准答案和8个混淆答案 (保证混淆至少缺一个标准字)
        function selectStdAndConfusions() {
            if (allAnswers.length < 9) {
                console.warn('诗库不足9,可能重复');
            }
            const shuffled = shuffleArray([...allAnswers]);
            for (let attempt = 0; attempt < 50; attempt++) {
                const std = shuffled[Math.floor(Math.random() * shuffled.length)];
                const stdCharsSet = new Set(std);
                const others = shuffled.filter(a => a !== std);
                if (others.length < 8) continue;
                const confusions = [];
                const shuffledOthers = shuffleArray([...others]);
                for (let cand of shuffledOthers) {
                    if (confusions.length >= 8) break;
                    const candSet = new Set(cand);
                    const missing = [...stdCharsSet].some(ch => !candSet.has(ch));
                    if (missing) confusions.push(cand);
                }
                if (confusions.length === 8) {
                    return { std, confusions };
                }
            }
            // 保底
            const std = allAnswers[0];
            const confusions = allAnswers.slice(1,9);
            return { std, confusions };
        }

        // ---------- 核心修复：保证标准答案的所有字符都在矩阵中 ----------
        function generateMatrixWithStdGuaranteed(std, confusions) {
            // 1. 收集所有字符 (包含重复)
            const allChars = [];
            const allAnswersArr = [std, ...confusions];
            for (let ans of allAnswersArr) {
                for (let ch of ans) {
                    allChars.push(ch);
                }
            } // 此时 allChars 长度为 9*7 = 63

            // 2. 必须包含的标准答案字符 (按顺序，保留重复)
            const mustHave = std.split(''); // 例如 ['床','前','明','月','光'] 如果有重复也保留

            // 3. 从 allChars 中移除 mustHave 中的每个字符 (移除第一个匹配的实例)
            // 复制一份 allChars 用于操作
            const remainingChars = [...allChars];
            const guaranteed = [];
            for (let ch of mustHave) {
                const index = remainingChars.indexOf(ch);
                if (index !== -1) {
                    guaranteed.push(ch);
                    remainingChars.splice(index, 1);
                } else {
                    // 理论上不会发生，因为 std 本身就在 allChars 中，但以防万一
                    console.warn('字符缺失，使用备用', ch);
                    guaranteed.push(ch); // 但仍加入，虽然可能破坏计数，但极少见
                }
            }

            // 4. 从 remainingChars 中随机抽取 42 个 (49-7) 补充
            shuffleArray(remainingChars);
            const needed = 49 - guaranteed.length; // 应为42
            const extra = remainingChars.slice(0, needed);

            // 5. 合并并打乱最终矩阵
            let matrixChars = guaranteed.concat(extra);
            matrixChars = shuffleArray(matrixChars);
            return matrixChars;
        }

        // 刷新网格UI
        function renderGrid(matrixChars) {
            gridContainer.innerHTML = '';
            for (let i = 0; i < 49; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.index = i;
                cell.textContent = matrixChars[i];
                gridContainer.appendChild(cell);
            }
            gridCells = document.querySelectorAll('.cell');
            attachCellListeners();
        }

        // 格子点击事件
        function attachCellListeners() {
            gridCells.forEach(cell => {
                cell.removeEventListener('click', cellClickHandler);
                cell.addEventListener('click', cellClickHandler);
            });
        }

        function cellClickHandler(e) {
            if (!gameActive || !canInteract) return;
            const index = parseInt(e.currentTarget.dataset.index);
            if (selectedIndices.includes(index)) {
                selectedIndices = selectedIndices.filter(i => i !== index);
                e.currentTarget.classList.remove('selected');
            } else {
                if (selectedIndices.length >= 7) return;
                selectedIndices.push(index);
                e.currentTarget.classList.add('selected');
            }
            updateCellsDisabledState();
        }

        function updateCellsDisabledState() {
            const exactlySeven = selectedIndices.length === 7;
            gridCells.forEach(cell => {
                const idx = parseInt(cell.dataset.index);
                if (!selectedIndices.includes(idx)) {
                    if (exactlySeven) {
                        cell.classList.add('disabled');
                    } else {
                        cell.classList.remove('disabled');
                    }
                } else {
                    cell.classList.remove('disabled');
                }
            });
            if (exactlySeven) {
                submitBtn.classList.remove('disabled-btn');
            } else {
                submitBtn.classList.add('disabled-btn');
            }
        }

        function clearSelectedAndEnable() {
            selectedIndices = [];
            gridCells.forEach(cell => {
                cell.classList.remove('selected', 'disabled');
            });
            submitBtn.classList.add('disabled-btn');
        }

        // 生成新题目 (使用修复后的矩阵生成)
        function loadNextQuestion() {
            if (!gameActive) return;
            const { std, confusions } = selectStdAndConfusions();
            currentStdAnswer = std;
            const matrix = generateMatrixWithStdGuaranteed(std, confusions);
            currentMatrix = matrix;
            renderGrid(matrix);
            clearSelectedAndEnable();
            canInteract = true;
        }

        // 显示右侧滑入横幅
        function showToast(isCorrect, answerText = '') {
            const toast = document.createElement('div');
            toast.className = `toast-message ${isCorrect ? 'correct' : 'wrong'}`;
            toast.innerHTML = isCorrect ? '✅ 答案正确' : '❌ 答案错误';
            if (!isCorrect && answerText) {
                toast.innerHTML += `<div class="toast-sub">答案：${answerText}</div>`;
            }
            toastContainer.appendChild(toast);
            setTimeout(() => {
                if (toast.parentNode) toast.remove();
            }, 2200);
        }

        // 提交答案
        function handleSubmit() {
            if (!gameActive || selectedIndices.length !== 7 || !canInteract) return;
            canInteract = false;

            const userChars = selectedIndices.map(idx => currentMatrix[idx]);
            const userAnswer = userChars.join('');
            const isCorrect = (userAnswer === currentStdAnswer);
            totalAttempts++;

            showToast(isCorrect, isCorrect ? '' : currentStdAnswer);

            if (isCorrect) {
                correctCount++;
                if (currentMode === 'count') {
                    countLeft--;
                }
            }

            updateStatDisplay();

            let gameEnded = false;
            if (currentMode === 'time') {
                if (timeLeft <= 0) gameEnded = true;
            } else {
                if (countLeft <= 0) gameEnded = true;
            }

            if (gameEnded) {
                finishGame();
                return;
            }

            setTimeout(() => {
                if (gameActive) {
                    loadNextQuestion();
                }
            }, 1500);
        }

        // 更新顶部统计
        function updateStatDisplay() {
            if (!gameActive) return;
            if (currentMode === 'time') {
                const mins = Math.floor(timeLeft / 60);
                const secs = timeLeft % 60;
                gameStatDisplay.textContent = `剩余 ${mins}:${secs.toString().padStart(2,'0')} · 得分 ${correctCount}`;
            } else {
                const elapsed = startTimestamp ? Math.floor((Date.now() - startTimestamp) / 1000) : 0;
                const mins = Math.floor(elapsed / 60);
                const secs = elapsed % 60;
                gameStatDisplay.textContent = `用时 ${mins}:${secs.toString().padStart(2,'0')} · ${correctCount}/20`;
            }
        }

        // 启动UI更新定时器
        function startUIUpdater() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!gameActive) return;
                if (currentMode === 'time') {
                    timeLeft--;
                    if (timeLeft < 0) timeLeft = 0;
                    updateStatDisplay();
                    if (timeLeft <= 0) {
                        finishGame();
                    }
                } else {
                    updateStatDisplay();
                }
            }, 1000);
        }

        // 结束游戏
        function finishGame() {
            gameActive = false;
            canInteract = false;
            if (timerInterval) clearInterval(timerInterval);

            let elapsedSeconds = 0;
            if (startTimestamp) {
                elapsedSeconds = Math.floor((Date.now() - startTimestamp) / 1000);
            }

            const accuracy = totalAttempts > 0 ? ((correctCount / totalAttempts) * 100).toFixed(1) : 0;

            if (currentMode === 'time') {
                resultTitle.innerText = '⏳ 计时结束';
                resultDetail.innerText = `完成 ${correctCount} 题 · 正确率 ${accuracy}%`;
                if (correctCount > highScoreTime) {
                    highScoreTime = correctCount;
                    localStorage.setItem('poem_highScore_time', highScoreTime);
                }
            } else {
                resultTitle.innerText = '🎯 完成20题';
                resultDetail.innerText = `用时 ${Math.floor(elapsedSeconds/60)}:${(elapsedSeconds%60).toString().padStart(2,'0')} · 正确率 ${accuracy}%`;
                if (elapsedSeconds < bestTimeCount) {
                    bestTimeCount = elapsedSeconds;
                    localStorage.setItem('poem_bestTime_count', bestTimeCount);
                }
            }
            updateHistoryUI();
            resultOverlay.style.display = 'flex';
        }

        // 确认成绩，返回主界面
        function confirmAndBack() {
            resultOverlay.style.display = 'none';
            gameView.classList.add('hidden-view');
            welcomeView.classList.remove('hidden-view');
            gameActive = false;
            clearInterval(timerInterval);
            selectedIndices = [];
            ruleBox.classList.remove('hidden-view');
            modeSelector.classList.add('hidden-view');
            startBtn.classList.remove('hidden-view');
        }

        // 开始游戏
        function startGame(mode) {
            currentMode = mode;
            gameActive = true;
            canInteract = true;
            correctCount = 0;
            totalAttempts = 0;
            if (mode === 'time') {
                timeLeft = 600;
            } else {
                countLeft = 20;
            }
            startTimestamp = Date.now();

            welcomeView.classList.add('hidden-view');
            gameView.classList.remove('hidden-view');
            ruleBox.classList.remove('hidden-view');
            modeSelector.classList.add('hidden-view');
            startBtn.classList.remove('hidden-view');

            updateStatDisplay();
            loadNextQuestion();
            startUIUpdater();
        }

        // 事件绑定
        startBtn.addEventListener('click', () => {
            ruleBox.classList.add('hidden-view');
            modeSelector.classList.remove('hidden-view');
            startBtn.classList.add('hidden-view');
        });

        modeTimeBtn.addEventListener('click', () => startGame('time'));
        modeCountBtn.addEventListener('click', () => startGame('count'));

        submitBtn.addEventListener('click', handleSubmit);

        confirmResult.addEventListener('click', confirmAndBack);

        contactLink.addEventListener('click', () => {
            emailDisplay.style.display = emailDisplay.style.display === 'none' ? 'inline-block' : 'none';
        });

        loadAnswers();

        window.addEventListener('beforeunload', () => {
            if (timerInterval) clearInterval(timerInterval);
        });
    })();
</script>
</body>
</html>
