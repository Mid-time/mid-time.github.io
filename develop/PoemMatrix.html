<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>诗阵 · 七言迷阵</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: #2b2b2b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .game-container {
            max-width: 700px;
            width: 100%;
            background: #3a3a3a;
            border-radius: 32px;
            padding: 24px;
            box-shadow: 0 20px 30px rgba(0,0,0,0.5);
            border: 1px solid #5a5a5a;
        }

        /* 历史记录区域 */
        .history-panel {
            background: #4f4f4f;
            border-radius: 24px;
            padding: 18px 20px;
            display: flex;
            justify-content: space-around;
            margin-bottom: 28px;
            border: 1px solid #6e6e6e;
            box-shadow: inset 0 2px 5px #2e2e2e;
        }

        .record-item {
            text-align: center;
            color: #d6d6d6;
        }

        .record-label {
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #a5a5a5;
            margin-bottom: 6px;
        }

        .record-value {
            font-size: 1.8rem;
            font-weight: 600;
            color: #f0f0f0;
            text-shadow: 0 2px 3px #1f1f1f;
        }

        /* 主视图切换 */
        .view {
            transition: opacity 0.2s ease;
        }

        .hidden-view {
            display: none !important;
        }

        /* 初始界面 */
        .welcome-area {
            text-align: center;
        }

        .big-btn {
            background: #5e5e5e;
            border: none;
            color: #eaeaea;
            font-size: 2rem;
            font-weight: 500;
            padding: 20px 30px;
            border-radius: 60px;
            width: 100%;
            margin: 20px 0 16px;
            box-shadow: 0 8px 0 #2d2d2d, 0 10px 15px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: all 0.08s linear;
            letter-spacing: 2px;
        }

        .big-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #2d2d2d, 0 8px 12px rgba(0,0,0,0.3);
        }

        .rule-box {
            background: #4b4b4b;
            padding: 18px;
            border-radius: 28px;
            color: #c0c0c0;
            text-align: left;
            border: 1px solid #6a6a6a;
            margin-bottom: 25px;
        }

        .rule-box p {
            margin: 8px 0;
            font-size: 1rem;
        }

        .rule-box .title {
            font-weight: 600;
            color: #dbdbdb;
            border-bottom: 1px dashed #777;
            padding-bottom: 6px;
            margin-bottom: 12px;
        }

        /* 模式选择按钮组 (动态出现) */
        .mode-selector {
            display: flex;
            gap: 16px;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .mode-btn {
            flex: 1;
            background: #606060;
            border: none;
            color: #ececec;
            font-size: 1.3rem;
            padding: 16px 0;
            border-radius: 40px;
            font-weight: 600;
            box-shadow: 0 5px 0 #353535;
            cursor: pointer;
            transition: 0.05s linear;
        }

        .mode-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #353535;
        }

        /* 游戏界面 */
        .game-play-area {
            text-align: center;
        }

        .stats-bar {
            background: #4a4a4a;
            padding: 14px 20px;
            border-radius: 40px;
            margin-bottom: 25px;
            font-size: 1.8rem;
            font-weight: 600;
            color: #e2e2e2;
            border: 1px solid #717171;
            box-shadow: inset 0 2px 5px #2f2f2f;
        }

        .grid-7x7 {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            background: #505050;
            padding: 18px;
            border-radius: 36px;
            border: 2px solid #6b6b6b;
            margin-bottom: 20px;
        }

        .cell {
            aspect-ratio: 1 / 1;
            background: #616161;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            font-weight: 600;
            color: #eaeaea;
            box-shadow: 0 4px 0 #383838;
            cursor: pointer;
            transition: all 0.07s;
            user-select: none;
        }

        .cell.selected {
            background: #9e9e9e;
            box-shadow: 0 0 0 3px #c5c5c5, 0 4px 0 #5a5a5a;
            color: #1f1f1f;
            font-weight: 700;
            transform: scale(1.02);
        }

        .cell.disabled {
            opacity: 0.3;
            pointer-events: none;
            box-shadow: 0 2px 0 #3a3a3a;
        }

        .submit-btn {
            background: #6b6b6b;
            border: none;
            color: #dcdcdc;
            font-size: 1.8rem;
            padding: 16px 30px;
            border-radius: 50px;
            font-weight: 600;
            width: 100%;
            box-shadow: 0 6px 0 #3b3b3b;
            cursor: pointer;
            transition: 0.05s linear;
            margin: 16px 0 12px;
        }

        .submit-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #3b3b3b;
        }

        .submit-btn.disabled-btn {
            opacity: 0.4;
            pointer-events: none;
            box-shadow: 0 4px 0 #3b3b3b;
        }

        .feedback-banner {
            background: #5a5a5a;
            border-left: 8px solid #b1b1b1;
            padding: 14px 18px;
            border-radius: 30px;
            margin: 15px 0;
            font-size: 1.3rem;
            font-weight: 500;
            color: #f2f2f2;
            text-align: center;
            transform: translateY(0);
            transition: all 0.3s ease-out;
            border: 1px solid #8f8f8f;
        }

        .wrong-answer-hint {
            background: #4d4d4d;
            color: #ffbaba;
            padding: 12px;
            border-radius: 24px;
            font-size: 1.3rem;
            word-break: break-all;
        }

        /* 成绩弹窗 */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(20,20,20,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .result-card {
            background: #4e4e4e;
            max-width: 380px;
            width: 90%;
            padding: 30px 20px;
            border-radius: 48px;
            border: 3px solid #8a8a8a;
            text-align: center;
            color: #efefef;
        }

        .result-card h2 {
            font-size: 2rem;
            margin-bottom: 16px;
            font-weight: 400;
        }

        .result-stat {
            font-size: 1.4rem;
            background: #3f3f3f;
            margin: 16px 0;
            padding: 12px;
            border-radius: 40px;
        }

        .confirm-btn {
            background: #707070;
            border: none;
            color: white;
            font-size: 1.7rem;
            padding: 12px 30px;
            border-radius: 50px;
            margin-top: 20px;
            box-shadow: 0 5px 0 #3a3a3a;
            cursor: pointer;
            width: 100%;
        }

        /* 底部联系 */
        .contact-area {
            margin-top: 25px;
            text-align: center;
            color: #8f8f8f;
            font-size: 1rem;
        }

        .contact-trigger {
            text-decoration: underline dotted;
            cursor: pointer;
            color: #b3b3b3;
        }

        .email-show {
            background: #404040;
            padding: 8px 18px;
            border-radius: 30px;
            display: inline-block;
            margin-top: 8px;
            color: #cfcfcf;
            border: 1px solid #6f6f6f;
        }
    </style>
</head>
<body>
<div class="game-container" id="gameContainer">
    <!-- 历史记录始终显示在最上 -->
    <div class="history-panel">
        <div class="record-item">
            <div class="record-label">⏱️ 计时最高得分</div>
            <div class="record-value" id="highScoreDisplay">0</div>
        </div>
        <div class="record-item">
            <div class="record-label">⚡ 计数最快时间</div>
            <div class="record-value" id="bestTimeDisplay">--</div>
        </div>
    </div>

    <!-- 初始视图 (欢迎界面) -->
    <div id="welcomeView" class="welcome-area view">
        <button class="big-btn" id="startBtn">▶ 开始游戏</button>
        <div class="rule-box" id="ruleBox">
            <div class="title">📜 规则说明</div>
            <p>✦ 点击格子选中汉字，每次最多选7个，凑成一句七言诗。</p>
            <p>✦ 选满7字后提交，正确得分，错误显示正确答案。</p>
            <p>✦ 计时模式：10分钟内答尽可能多；计数模式：最快完成20题。</p>
            <p>✦ 只有答对才会减少剩余题数（计数模式）。</p>
        </div>
        <!-- 模式选择区 (开始后替换规则) 初始隐藏 -->
        <div id="modeSelector" class="mode-selector hidden-view">
            <button class="mode-btn" id="modeTime">⏳ 计时 (10分钟)</button>
            <button class="mode-btn" id="modeCount">🔢 计数 (20题)</button>
        </div>
    </div>

    <!-- 游戏视图 (初始隐藏) -->
    <div id="gameView" class="game-play-area view hidden-view">
        <div class="stats-bar" id="gameStatDisplay">剩余 10:00</div>

        <!-- 7x7 网格 -->
        <div class="grid-7x7" id="gridContainer"></div>

        <!-- 提交按钮 -->
        <button class="submit-btn disabled-btn" id="submitGameBtn">提交答案</button>

        <!-- 反馈横幅区域 -->
        <div id="feedbackArea" style="min-height: 70px;"></div>

        <!-- 隐藏的正确答案显示(错误时使用) -->
        <div id="wrongAnswerDisplay" class="wrong-answer-hint" style="display: none;"></div>
    </div>

    <!-- 底部联系 -->
    <div class="contact-area">
        <span class="contact-trigger" id="contactLink">📧 联系我</span>
        <div id="emailDisplay" class="email-show" style="display: none;">poem.matrix@7x7.me</div>
    </div>
</div>

<!-- 成绩弹窗 (隐藏) -->
<div id="resultOverlay" class="overlay" style="display: none;">
    <div class="result-card">
        <h2 id="resultTitle">⏰ 时间到</h2>
        <div class="result-stat" id="resultDetail">完成 0 题 · 正确率 0%</div>
        <button class="confirm-btn" id="confirmResult">确 认</button>
    </div>
</div>

<script>
    (function() {
        // ---------- 全局变量 ----------
        let allAnswers = [];                // 从answer.txt加载的所有诗句
        // 默认后备诗句 (七言)
        const fallbackAnswers = [
            "床前明月光疑是地上霜", "两个黄鹂鸣翠柳一行白鹭上青天",
            "窗含西岭千秋雪门泊东吴万里船", "春眠不觉晓处处闻啼鸟",
            "白日依山尽黄河入海流", "清明时节雨纷纷路上行人欲断魂",
            "独在异乡为异客每逢佳节倍思亲", "故人西辞黄鹤楼烟花三月下扬州",
            "海内存知己天涯若比邻", "相见时难别亦难东风无力百花残",
            "烟笼寒水月笼沙夜泊秦淮近酒家", "昨夜星辰昨夜风画楼西畔桂堂东",
            "身无彩凤双飞翼心有灵犀一点通", "君问归期未有期巴山夜雨涨秋池",
            "何当共剪西窗烛却话巴山夜雨时", "沧海月明珠有泪蓝田日暖玉生烟",
            "此情可待成追忆只是当时已惘然", "锦瑟无端五十弦一弦一柱思华年",
            "庄生晓梦迷蝴蝶望帝春心托杜鹃", "大漠孤烟直长河落日圆",
        ].filter(s => s.length === 7);  // 仅保留恰好7字 (部分可能不对,手动修正一下)
        // 手动保证都是7字(用于演示)
        const demoPoems = [
            "两个黄鹂鸣翠柳", "一行白鹭上青天", "窗含西岭千秋雪", "门泊东吴万里船",
            "春眠不觉晓处处", "处处闻啼鸟夜来", "夜来风雨声花落", "白日依山尽黄河",
            "黄河入海流欲穷", "欲穷千里目更上", "更上一层楼清明", "清明时节雨纷纷",
            "路上行人欲断魂", "借问酒家何处有", "牧童遥指杏花村", "独在异乡为异客",
            "每逢佳节倍思亲", "遥知兄弟登高处", "遍插茱萸少一人", "故人西辞黄鹤楼"
        ]; // 正好20个七言

        // 游戏状态
        let currentMode = null;              // 'time' 或 'count'
        let timerInterval = null;
        let gameActive = false;
        let timeLeft = 600;                  // 计时模式剩余秒数 (10分钟=600秒)
        let countLeft = 20;                   // 计数模式剩余题数
        let startTimestamp = null;            // 模式开始时间戳(毫秒)
        let correctCount = 0;                 // 本次答对题数
        totalAttempts = 0;                    // 本次总提交次数(用于正确率)
        let currentStdAnswer = '';            // 当前正确答案
        let currentMatrix = [];                // 49个汉字一维数组
        let selectedIndices = [];              // 按点击顺序记录选中的索引 (最多7)
        let gridCells = [];                    // 用于快速访问格子DOM
        let canInteract = true;                 // 防止提交后连点

        // 历史记录 (localStorage)
        let highScoreTime = parseInt(localStorage.getItem('poem_highScore_time')) || 0;   // 计时最高得分(题数)
        let bestTimeCount = parseFloat(localStorage.getItem('poem_bestTime_count')) || Infinity;  // 计数最快完成秒数

        // DOM 元素
        const welcomeView = document.getElementById('welcomeView');
        const gameView = document.getElementById('gameView');
        const startBtn = document.getElementById('startBtn');
        const ruleBox = document.getElementById('ruleBox');
        const modeSelector = document.getElementById('modeSelector');
        const modeTimeBtn = document.getElementById('modeTime');
        const modeCountBtn = document.getElementById('modeCount');
        const gameStatDisplay = document.getElementById('gameStatDisplay');
        const gridContainer = document.getElementById('gridContainer');
        const submitBtn = document.getElementById('submitGameBtn');
        const feedbackArea = document.getElementById('feedbackArea');
        const wrongAnswerDisplay = document.getElementById('wrongAnswerDisplay');
        const highScoreDisplay = document.getElementById('highScoreDisplay');
        const bestTimeDisplay = document.getElementById('bestTimeDisplay');
        const contactLink = document.getElementById('contactLink');
        const emailDisplay = document.getElementById('emailDisplay');
        const resultOverlay = document.getElementById('resultOverlay');
        const resultTitle = document.getElementById('resultTitle');
        const resultDetail = document.getElementById('resultDetail');
        const confirmResult = document.getElementById('confirmResult');

        // 初始化更新显示
        function updateHistoryUI() {
            highScoreDisplay.textContent = highScoreTime;
            if (bestTimeCount === Infinity) {
                bestTimeDisplay.textContent = '--';
            } else {
                const mins = Math.floor(bestTimeCount / 60);
                const secs = Math.floor(bestTimeCount % 60);
                bestTimeDisplay.textContent = `${mins}:${secs.toString().padStart(2,'0')}`;
            }
        }
        updateHistoryUI();

        // ---------- 加载诗句库 ----------
        async function loadAnswers() {
            try {
                const response = await fetch('answer.txt');
                if (!response.ok) throw new Error('网络问题');
                const text = await response.text();
                const lines = text.split(/\r?\n/).map(line => line.trim()).filter(line => line.length === 7);
                if (lines.length > 0) {
                    allAnswers = lines;
                } else {
                    allAnswers = [...demoPoems];
                }
            } catch (e) {
                console.warn('加载answer.txt失败，使用默认诗库', e);
                allAnswers = [...demoPoems];
            }
        }

        // 辅助: 洗牌
        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // 选择标准答案和8个混淆答案 (满足混淆至少缺一个标准字)
        function selectStdAndConfusions() {
            if (allAnswers.length < 9) {
                // 如果不足9个，重复使用 (但尽量不，演示库够)
                console.warn('诗库不足9,可能重复');
            }
            const shuffled = shuffleArray([...allAnswers]);
            for (let attempt = 0; attempt < 50; attempt++) {
                const std = shuffled[Math.floor(Math.random() * shuffled.length)];
                const stdCharsSet = new Set(std);
                const others = shuffled.filter(a => a !== std);
                if (others.length < 8) continue; // 不够则重选
                const confusions = [];
                const shuffledOthers = shuffleArray([...others]);
                for (let cand of shuffledOthers) {
                    if (confusions.length >= 8) break;
                    const candSet = new Set(cand);
                    // 检查是否至少缺一个标准字的字符
                    const missing = [...stdCharsSet].some(ch => !candSet.has(ch));
                    if (missing) confusions.push(cand);
                }
                if (confusions.length === 8) {
                    return { std, confusions };
                }
            }
            // 保底：随便选8个，忽略条件
            const std = allAnswers[0];
            const confusions = allAnswers.slice(1,9);
            return { std, confusions };
        }

        // 生成矩阵: 根据标准+8混淆构造字池 -> 随机选49字
        function generateMatrixFromAnswers(std, confusions) {
            // 所有9个答案拼成字符数组 (保留每个字的出现次数)
            let charPool = [];
            const allAnswersArr = [std, ...confusions];
            for (let ans of allAnswersArr) {
                for (let ch of ans) {
                    charPool.push(ch);
                }
            }
            // 随机打乱池子
            charPool = shuffleArray(charPool);
            // 取前49个作为矩阵 (如果池子不足49，但总有63)
            const matrixChars = charPool.slice(0, 49);
            return matrixChars;
        }

        // 刷新网格UI
        function renderGrid(matrixChars) {
            gridContainer.innerHTML = '';
            for (let i = 0; i < 49; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.index = i;
                cell.textContent = matrixChars[i];
                gridContainer.appendChild(cell);
            }
            gridCells = document.querySelectorAll('.cell');
            attachCellListeners();
        }

        // 格子点击事件
        function attachCellListeners() {
            gridCells.forEach(cell => {
                cell.removeEventListener('click', cellClickHandler);
                cell.addEventListener('click', cellClickHandler);
            });
        }

        function cellClickHandler(e) {
            if (!gameActive || !canInteract) return;
            const index = parseInt(e.currentTarget.dataset.index);
            if (selectedIndices.includes(index)) {
                // 取消选中
                selectedIndices = selectedIndices.filter(i => i !== index);
                e.currentTarget.classList.remove('selected');
            } else {
                if (selectedIndices.length >= 7) return; // 最多7
                selectedIndices.push(index);
                e.currentTarget.classList.add('selected');
            }

            // 更新其他格子的禁用状态 & 提交按钮状态
            updateCellsDisabledState();
        }

        function updateCellsDisabledState() {
            const exactlySeven = selectedIndices.length === 7;
            // 灰化所有未被选中的格子
            gridCells.forEach(cell => {
                const idx = parseInt(cell.dataset.index);
                if (!selectedIndices.includes(idx)) {
                    if (exactlySeven) {
                        cell.classList.add('disabled');
                    } else {
                        cell.classList.remove('disabled');
                    }
                } else {
                    cell.classList.remove('disabled'); // 选中的保持可点击(可以取消)
                }
            });
            // 提交按钮可用性
            if (exactlySeven) {
                submitBtn.classList.remove('disabled-btn');
            } else {
                submitBtn.classList.add('disabled-btn');
            }
        }

        // 重置高亮 & 启用格子
        function clearSelectedAndEnable() {
            selectedIndices = [];
            gridCells.forEach(cell => {
                cell.classList.remove('selected', 'disabled');
            });
            submitBtn.classList.add('disabled-btn');
        }

        // 生成新题目 (重新选择答案并渲染矩阵)
        function loadNextQuestion() {
            if (!gameActive) return;
            const { std, confusions } = selectStdAndConfusions();
            currentStdAnswer = std;
            const matrix = generateMatrixFromAnswers(std, confusions);
            currentMatrix = matrix;
            renderGrid(matrix);
            clearSelectedAndEnable();
            // 隐藏之前的错误答案显示
            wrongAnswerDisplay.style.display = 'none';
            feedbackArea.innerHTML = ''; // 清空横幅
            canInteract = true;
        }

        // 提交答案逻辑
        function handleSubmit() {
            if (!gameActive || selectedIndices.length !== 7 || !canInteract) return;
            canInteract = false;  // 防止重复提交

            // 获取用户组成的诗句 (按照点击顺序)
            const userChars = selectedIndices.map(idx => currentMatrix[idx]);
            const userAnswer = userChars.join('');

            const isCorrect = (userAnswer === currentStdAnswer);
            totalAttempts++;

            // 显示反馈横幅
            const banner = document.createElement('div');
            banner.className = 'feedback-banner';
            if (isCorrect) {
                banner.style.borderLeftColor = '#a3d8a3';
                banner.innerHTML = '✅ 答案正确';
                correctCount++;
                // 计数模式：答对才减
                if (currentMode === 'count') {
                    countLeft--;
                }
            } else {
                banner.style.borderLeftColor = '#f0a3a3';
                banner.innerHTML = '❌ 答案错误';
                // 显示正确答案
                wrongAnswerDisplay.style.display = 'block';
                wrongAnswerDisplay.textContent = `正确答案：${currentStdAnswer}`;
            }

            feedbackArea.innerHTML = '';
            feedbackArea.appendChild(banner);

            // 更新剩余题数/时间显示
            updateStatDisplay();

            // 检查游戏是否结束 (时间耗尽 或 计数为0)
            let gameEnded = false;
            if (currentMode === 'time') {
                if (timeLeft <= 0) gameEnded = true;
            } else {
                if (countLeft <= 0) gameEnded = true;
            }

            if (gameEnded) {
                // 游戏结束，展示成绩
                finishGame();
                return;
            }

            // 未结束：1.5秒后加载下一题
            setTimeout(() => {
                if (gameActive) {
                    loadNextQuestion();
                }
            }, 1500);
        }

        // 更新顶部统计
        function updateStatDisplay() {
            if (currentMode === 'time') {
                const mins = Math.floor(timeLeft / 60);
                const secs = timeLeft % 60;
                gameStatDisplay.textContent = `剩余 ${mins}:${secs.toString().padStart(2,'0')}`;
            } else {
                gameStatDisplay.textContent = `剩余 ${countLeft} 题`;
            }
        }

        // 开始计时器 (仅计时模式)
        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!gameActive) return;
                if (currentMode === 'time') {
                    timeLeft--;
                    updateStatDisplay();
                    if (timeLeft <= 0) {
                        timeLeft = 0;
                        updateStatDisplay();
                        finishGame();
                    }
                }
            }, 1000);
        }

        // 结束游戏，弹出成绩
        function finishGame() {
            gameActive = false;
            canInteract = false;
            if (timerInterval) clearInterval(timerInterval);

            // 计算用时 (秒)
            let elapsedSeconds = 0;
            if (startTimestamp) {
                elapsedSeconds = Math.floor((Date.now() - startTimestamp) / 1000);
            }

            const accuracy = totalAttempts > 0 ? ((correctCount / totalAttempts) * 100).toFixed(1) : 0;

            // 根据模式设置标题与更新记录
            if (currentMode === 'time') {
                resultTitle.innerText = '⏳ 计时结束';
                resultDetail.innerText = `完成 ${correctCount} 题 · 正确率 ${accuracy}%`;
                // 更新最高得分
                if (correctCount > highScoreTime) {
                    highScoreTime = correctCount;
                    localStorage.setItem('poem_highScore_time', highScoreTime);
                }
            } else {
                resultTitle.innerText = '🎯 完成20题';
                resultDetail.innerText = `用时 ${Math.floor(elapsedSeconds/60)}:${(elapsedSeconds%60).toString().padStart(2,'0')} · 正确率 ${accuracy}%`;
                // 更新最快时间
                if (elapsedSeconds < bestTimeCount) {
                    bestTimeCount = elapsedSeconds;
                    localStorage.setItem('poem_bestTime_count', bestTimeCount);
                }
            }
            updateHistoryUI();

            // 显示弹窗
            resultOverlay.style.display = 'flex';
        }

        // 确认成绩，返回主界面
        function confirmAndBack() {
            resultOverlay.style.display = 'none';
            // 切回欢迎界面
            gameView.classList.add('hidden-view');
            welcomeView.classList.remove('hidden-view');
            // 重置游戏相关变量
            gameActive = false;
            clearInterval(timerInterval);
            // 清理选中
            selectedIndices = [];
            // 显示规则，隐藏模式选择 (重置开始状态)
            ruleBox.classList.remove('hidden-view');
            modeSelector.classList.add('hidden-view');
            startBtn.classList.remove('hidden-view');
        }

        // 开始游戏 (由模式按钮触发)
        function startGame(mode) {
            currentMode = mode;
            gameActive = true;
            canInteract = true;
            // 重置统计数据
            correctCount = 0;
            totalAttempts = 0;
            if (mode === 'time') {
                timeLeft = 600;
                countLeft = 20; // 无用
            } else {
                countLeft = 20;
                timeLeft = 600; // 无用
            }
            startTimestamp = Date.now();

            // 界面切换
            welcomeView.classList.add('hidden-view');
            gameView.classList.remove('hidden-view');
            ruleBox.classList.remove('hidden-view'); // 确保以后回来不变
            modeSelector.classList.add('hidden-view');
            startBtn.classList.remove('hidden-view');

            // 显示正确统计
            updateStatDisplay();

            // 生成第一个题目
            loadNextQuestion();

            // 启动计时器 (如果计时模式)
            if (mode === 'time') {
                startTimer();
            } else {
                // 计数模式不需要定时器，但需要计时开始时间 (已在上面记录)
                if (timerInterval) clearInterval(timerInterval);
            }
        }

        // ---------- 事件绑定 ----------
        startBtn.addEventListener('click', () => {
            // 点击开始：隐藏规则，显示模式选择
            ruleBox.classList.add('hidden-view');
            modeSelector.classList.remove('hidden-view');
            startBtn.classList.add('hidden-view');
        });

        modeTimeBtn.addEventListener('click', () => startGame('time'));
        modeCountBtn.addEventListener('click', () => startGame('count'));

        submitBtn.addEventListener('click', handleSubmit);

        confirmResult.addEventListener('click', confirmAndBack);

        // 联系我
        contactLink.addEventListener('click', () => {
            if (emailDisplay.style.display === 'none') {
                emailDisplay.style.display = 'inline-block';
            } else {
                emailDisplay.style.display = 'none';
            }
        });

        // 初始化加载诗库
        loadAnswers().then(() => {
            // 可以预先测试一下
            console.log('诗库加载完成, 共', allAnswers.length, '句');
        });

        // 额外：处理页面卸载时清除计时器
        window.addEventListener('beforeunload', function() {
            if (timerInterval) clearInterval(timerInterval);
        });
    })();
</script>
</body>
</html>
